<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сортировка · одна карточка</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    .container {
      width: 700px;
      height: 700px;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 16px 40px rgba(0, 20, 40, 0.12);
      display: flex;
      flex-direction: column;
      padding: 18px 20px 20px;
      position: relative;
      overflow: hidden;
      border: 1px solid #e8edf4;
    }

    /* заголовок-описание */
    .header-description {
      flex: 0 0 auto;
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #e8edf4;
      margin-bottom: 12px;
    }

    .header-description h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #142b3f;
      letter-spacing: -0.2px;
    }

    .header-description p {
      font-size: 0.85rem;
      color: #4a6a8a;
      margin-top: 4px;
    }

    /* верхняя зона: текущая карточка */
    .current-card-area {
      flex: 0 0 auto;
      height: 120px;
      background: #f5f8fc;
      border-radius: 20px;
      padding: 12px 16px;
      margin-bottom: 14px;
      border: 2px solid #dce5ef;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: background 0.2s;
      position: relative;
    }

    .current-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: #2f5377;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      align-self: flex-start;
    }

    .current-card-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      min-height: 60px;
      align-items: center;
    }

    .card-current {
      background: white;
      border-radius: 16px;
      padding: 12px 24px;
      font-size: 0.9rem;
      line-height: 1.4;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      border-left: 6px solid #5f7e9e;
      max-width: 90%;
      text-align: center;
      color: #142b3f;
      cursor: grab;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.2s, background 0.2s;
      word-break: break-word;
      position: relative;
    }

    .card-current:active {
      cursor: grabbing;
    }

    .card-current.dragging {
      opacity: 0.3;
      transform: scale(0.95);
    }

    .card-current.correct {
      border-left-color: #1f8b4c;
      background: #e8f5ee;
      box-shadow: 0 0 0 2px #1f8b4c;
    }

    .card-current.incorrect {
      border-left-color: #b13e3e;
      background: #fceeec;
      box-shadow: 0 0 0 2px #b13e3e;
    }

    .card-current .badge-hidden {
      display: none;
    }

    /* основное поле: две колонки */
    .drop-zone-wrapper {
      flex: 1;
      display: flex;
      gap: 16px;
      min-height: 0;
    }

    .drop-zone {
      flex: 1;
      background: #fafcff;
      border-radius: 20px;
      padding: 10px 10px 12px;
      border: 2px dashed #d0dcec;
      display: flex;
      flex-direction: column;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
      overflow: hidden;
    }

    .drop-zone--for {
      background: #f5faf7;
      border-color: #1f8b4c;
    }

    .drop-zone--against {
      background: #faf5f5;
      border-color: #b13e3e;
    }

    .drop-zone.drag-over {
      box-shadow: inset 0 0 0 3px #3e7bb6;
      background: #ecf3fd;
    }

    .drop-zone-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px 6px;
      border-bottom: 1px solid #dce5ef;
      flex-shrink: 0;
    }

    .drop-zone-header h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #1d3c5c;
    }

    .drop-zone--for .drop-zone-header h3 {
      color: #0f6e3a;
    }

    .drop-zone--against .drop-zone-header h3 {
      color: #a13232;
    }

    .counter {
      background: rgba(0, 0, 0, 0.04);
      padding: 0 12px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #1e3b5a;
    }

    .card-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 2px 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 60px;
    }

    .card-list .card-placed {
      background: white;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 0.78rem;
      line-height: 1.35;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border-left: 5px solid #b0c5db;
      word-break: break-word;
      color: #142b3f;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .card-placed.correct {
      border-left-color: #1f8b4c;
      background: #e8f5ee;
    }

    .card-placed.incorrect {
      border-left-color: #b13e3e;
      background: #fceeec;
    }

    .card-placed .badge-hidden {
      display: none;
    }

    .empty-placeholder {
      color: #8da3bf;
      font-size: 0.8rem;
      text-align: center;
      padding: 14px 0;
      font-style: italic;
      background: rgba(0,0,0,0.01);
      border-radius: 40px;
      border: 1px dashed #d0dcec;
    }

    /* кнопки */
    .actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      padding-top: 10px;
      flex-shrink: 0;
      border-top: 1px solid #e8edf4;
      margin-top: 8px;
    }

    .btn {
      background: white;
      border: 1px solid #d0dcec;
      padding: 8px 32px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #1f3f61;
      cursor: pointer;
      transition: all 0.12s;
      background: #f8faff;
    }

    .btn:hover {
      background: #eef4fc;
      border-color: #8aadcf;
    }

    .btn-check {
      background: #1f8b4c;
      border-color: #1f8b4c;
      color: white;
    }

    .btn-check:hover {
      background: #16733e;
    }

    .btn-reset {
      background: #f5f8fc;
      border-color: #d0dcec;
    }

    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .card-list::-webkit-scrollbar {
      width: 4px;
    }
    .card-list::-webkit-scrollbar-thumb {
      background: #d0dcec;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<div class="container" id="appContainer">

  <!-- ОПИСАНИЕ СВЕРХУ -->
  <div class="header-description">
    <h2>🧩 Сортировка аргументов</h2>
    <p>Перетащите карточку в нужную колонку. Сортируйте аргументы «ЗА» и «ПРОТИВ» автоматизации.</p>
  </div>

  <!-- ВЕРХНЯЯ ЗОНА: одна текущая карточка -->
  <div class="current-card-area" id="currentArea">
    <div class="current-label">📌 Текущая карточка</div>
    <div class="current-card-wrapper" id="currentWrapper">
      <!-- сюда рендерится одна карточка -->
    </div>
  </div>

  <!-- ДВЕ КОЛОНКИ -->
  <div class="drop-zone-wrapper">
    <!-- Убедит -->
    <div class="drop-zone drop-zone--for" id="zoneFor" data-zone="for">
      <div class="drop-zone-header">
        <h3>✅ Убедит</h3>
        <span class="counter" id="countFor">0</span>
      </div>
      <div class="card-list" id="listFor"></div>
    </div>

    <!-- Не убедит -->
    <div class="drop-zone drop-zone--against" id="zoneAgainst" data-zone="against">
      <div class="drop-zone-header">
        <h3>❌ Не убедит</h3>
        <span class="counter" id="countAgainst">0</span>
      </div>
      <div class="card-list" id="listAgainst"></div>
    </div>
  </div>

  <!-- КНОПКИ -->
  <div class="actions">
    <button class="btn btn-check" id="checkBtn">✅ Проверить</button>
    <button class="btn btn-reset" id="resetBtn">⟳ Сбросить все</button>
  </div>
</div>

<script>
  (function() {
    // ---------- ЭТАЛОННЫЕ ДАННЫЕ (правильные ответы) ----------
    const FOR_TEXTS = [
      "Снижение риска аварий – контроль давления, температуры, загазованности",
      "Своевременное оповещение – мгновенное информирование диспетчера",
      "Полное документирование – автоматическая фиксация параметров",
      "Удаленный мониторинг – контроль удалённых объектов",
      "Снижение нагрузки на персонал – операторы анализируют, а не снимают показания",
      "Единая база данных – паспорта, журналы, акты в цифре",
      "Ускорение экспертизы – готовые отчёты для Ростехнадзора",
      "Повышение дисциплины – регламентные операции не пропустить"
    ];

    const AGAINST_TEXTS = [
      "Высокая стоимость – лицензии, оборудование, монтаж",
      "Сложность интеграции – старые агрегаты без цифровых интерфейсов",
      "Риск кибератак – уязвимости при подключении к сетям",
      "Переобучение коллектива – месяцы тренингов",
      "Сопротивление персонала – недоверие к автоматике",
      "Непредсказуемые ошибки ПО – баги опаснее человеческих",
      "Метрологическая поверка – постоянная калибровка датчиков"
    ];

    // ---------- СОСТОЯНИЕ ----------
    let cards = [];
    let currentIndex = 0;
    let checkMode = false;

    function buildCards() {
      const result = [];
      FOR_TEXTS.forEach(text => {
        result.push({
          id: `f-${Date.now()}-${Math.random()}`,
          text,
          correctType: 'for',
          placed: false,
          userType: null
        });
      });
      AGAINST_TEXTS.forEach(text => {
        result.push({
          id: `a-${Date.now()}-${Math.random()}`,
          text,
          correctType: 'against',
          placed: false,
          userType: null
        });
      });
      return shuffleArray(result);
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initData() {
      cards = buildCards();
      currentIndex = 0;
      checkMode = false;
      syncCurrentIndex();
    }

    function syncCurrentIndex() {
      const firstUnplaced = cards.findIndex(c => !c.placed);
      if (firstUnplaced === -1) {
        currentIndex = -1;
      } else {
        currentIndex = firstUnplaced;
      }
    }

    initData();

    // DOM
    const currentWrapper = document.getElementById('currentWrapper');
    const listFor = document.getElementById('listFor');
    const listAgainst = document.getElementById('listAgainst');
    const countFor = document.getElementById('countFor');
    const countAgainst = document.getElementById('countAgainst');
    const zoneFor = document.getElementById('zoneFor');
    const zoneAgainst = document.getElementById('zoneAgainst');
    const checkBtn = document.getElementById('checkBtn');
    const resetBtn = document.getElementById('resetBtn');

    // ---------- РЕНДЕР ----------
    function render() {
      currentWrapper.innerHTML = '';
      listFor.innerHTML = '';
      listAgainst.innerHTML = '';

      const currentCard = (currentIndex !== -1 && currentIndex < cards.length) ? cards[currentIndex] : null;

      if (currentCard && !currentCard.placed) {
        const el = createCardElement(currentCard, true);
        currentWrapper.appendChild(el);
      } else {
        const msg = document.createElement('div');
        msg.style.cssText = 'color: #2f5377; font-size: 0.9rem; font-weight: 500;';
        msg.textContent = '🎉 Все карточки распределены! Нажмите "Проверить".';
        currentWrapper.appendChild(msg);
      }

      const placedFor = cards.filter(c => c.placed && c.userType === 'for');
      const placedAgainst = cards.filter(c => c.placed && c.userType === 'against');

      countFor.textContent = placedFor.length;
      countAgainst.textContent = placedAgainst.length;

      if (placedFor.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-placeholder';
        empty.textContent = 'Нет аргументов ЗА';
        listFor.appendChild(empty);
      } else {
        placedFor.forEach(card => {
          const el = createCardElement(card, false);
          listFor.appendChild(el);
        });
      }

      if (placedAgainst.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-placeholder';
        empty.textContent = 'Нет аргументов ПРОТИВ';
        listAgainst.appendChild(empty);
      } else {
        placedAgainst.forEach(card => {
          const el = createCardElement(card, false);
          listAgainst.appendChild(el);
        });
      }

      const hasUnplaced = cards.some(c => !c.placed);
      checkBtn.disabled = hasUnplaced;
    }

    function createCardElement(card, isCurrent) {
      const div = document.createElement('div');
      if (isCurrent) {
        div.className = 'card-current';
        div.setAttribute('draggable', 'true');
      } else {
        div.className = 'card-placed';
        div.setAttribute('draggable', 'false');
      }

      div.dataset.id = card.id;

      const textSpan = document.createElement('span');
      textSpan.textContent = card.text;
      div.appendChild(textSpan);

      if (checkMode && card.placed) {
        if (card.userType === card.correctType) {
          div.classList.add('correct');
        } else {
          div.classList.add('incorrect');
        }
      }

      if (isCurrent) {
        div.addEventListener('dragstart', handleDragStart);
        div.addEventListener('dragend', handleDragEnd);
      }

      return div;
    }

    // ---------- DRAG ----------
    let draggedId = null;

    function handleDragStart(e) {
      const el = e.target.closest('.card-current');
      if (!el) return;
      draggedId = el.dataset.id;
      el.classList.add('dragging');
      e.dataTransfer.setData('text/plain', draggedId);
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragEnd(e) {
      const el = e.target.closest('.card-current');
      if (el) el.classList.remove('dragging');
      [zoneFor, zoneAgainst].forEach(z => z.classList.remove('drag-over'));
    }

    // ---------- DROP ZONES ----------
    function setupDropZones() {
      [zoneFor, zoneAgainst].forEach(zone => {
        zone.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          zone.classList.add('drag-over');
        });

        zone.addEventListener('dragleave', () => {
          zone.classList.remove('drag-over');
        });

        zone.addEventListener('drop', (e) => {
          e.preventDefault();
          zone.classList.remove('drag-over');
          if (checkMode) return;

          const id = e.dataTransfer.getData('text/plain');
          if (!id) return;
          const card = cards.find(c => c.id === id);
          if (!card || card.placed) return;

          const targetZone = zone.dataset.zone;
          card.userType = targetZone;
          card.placed = true;

          syncCurrentIndex();
          render();
        });
      });
    }

    // ---------- ПРОВЕРКА ----------
    function runCheck() {
      const unplaced = cards.some(c => !c.placed);
      if (unplaced) {
        alert('Разместите все карточки перед проверкой.');
        return;
      }
      checkMode = true;
      render();
    }

    // ---------- СБРОС ----------
    function resetAll() {
      cards.forEach(c => {
        c.placed = false;
        c.userType = null;
      });
      checkMode = false;
      syncCurrentIndex();
      render();
    }

    // ---------- ИНИЦИАЛИЗАЦИЯ ----------
    setupDropZones();
    render();

    checkBtn.addEventListener('click', runCheck);
    resetBtn.addEventListener('click', resetAll);
  })();
</script>
</body>
</html>
